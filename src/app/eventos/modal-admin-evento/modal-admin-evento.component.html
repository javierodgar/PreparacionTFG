<p>modal-admin-evento works!</p>
<div class="modal-overlay" *ngIf="isVisible">
  <div class="modal-container">
    <div class="modal-header">
      <div class="modal-nav">
        <button
          [ngClass]="{'active': activeTab === 'edicion'}"
          (click)="setActiveTab('edicion')"
        >
          Edición
        </button>
        <button
          [ngClass]="{'active': activeTab === 'suscritos'}"
          (click)="setActiveTab('suscritos')"
        >
          Gente Suscrita
        </button>
        <button
          [ngClass]="{'active': activeTab === 'estados'}"
          (click)="setActiveTab('estados')"
        >
          Estados
        </button>
      </div>
      <button class="close-button" (click)="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div *ngIf="activeTab === 'edicion'">
        <h3>Edición del Evento</h3>
        <app-editar-evento
        (guardarEvento)="guardarCambios($event)"
        (cancelarEdicion)="cancelarEdicion()"
      ></app-editar-evento>
      </div>
      <div *ngIf="activeTab === 'suscritos'">
        <h3>Gente Suscrita</h3>
        <p>Lista de usuarios suscritos a este evento.</p>
        <app-listado-inscritos></app-listado-inscritos>
      </div>
      <div *ngIf="activeTab === 'estados'">
        <h3>Estados Evento</h3>
        <h4>Eliminar Evento</h4>
        <button class="confirm-delete-button" (click)="eliminarEvento()">Eliminar</button>
        <h4>Cancelar Evento</h4>
        <button class="confirm-delete-button" (click)="actualizarEstado(eventoId, nuevoEstado)">{{cancelarReanudar}}</button>
      </div>
    </div>
  </div>
</div>
