<div class="modal" *ngIf="isVisible">
    <div class="modal-content">
      <span class="close-button" (click)="cerrar()">&times;</span>
      <h3>Crear Nuevo Evento</h3>
      <form (submit)="submitForm($event)">
        <div>
          <label for="titulo">Título:</label>
          <input type="text" id="titulo" name="titulo" required>
        </div>
        <div>
          <label for="descripcion">Descripción:</label>
          <textarea id="descripcion" name="descripcion"></textarea>
        </div>
        <div>
          <label for="categoria">Categoría:</label>
          <select id="categoria" name="categoria" required>
            <option value="Motos">Motos</option>
            <option value="Coches">Coches</option>
            <option value="Mixto">Mixto</option>
          </select>
        </div>
        <div>
          <label for="imagen_portada">Imagen de Portada:</label>
          <input type="file" id="imagen_portada" name="imagen_portada">
        </div>
        <div>
          <label for="direccion">Dirección:</label>
          <input type="text" id="direccion" name="direccion" required>
        </div>
        <div>
          <label for="fecha_inicio">Fecha de Inicio:</label>
          <input type="datetime-local" id="fecha_inicio" name="fecha_inicio" required>
        </div>
        <div>
          <label for="fecha_fin">Fecha de Fin:</label>
          <input type="datetime-local" id="fecha_fin" name="fecha_fin" class="form-control">
        </div>
        <button type="submit">Guardar Evento</button>
      </form>
    </div>
  </div>
