<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="css/stylePrincipal.css"> -->
</head>
<body>
    <!-- Barra de navegación izquierda -->
    <div class="sidebar">
        <div class="profile-pic" id="profilePic" (click)="showUser()" [style.backgroundImage]="profileImageUrl ? 'url(' + profileImageUrl + ')' : ''"></div>
        <div class="nav-icons">
            <div class="nav-icon" id="createPostBtn" (click)="showPosts()"><img src="/icons/libro.png" alt="icono de libro para mostrar todas las publicaciones"></div>
            <div class="nav-icon" id="showPosts" (click)="openModal()"><img src="/icons/publicacion.png" alt="icono de mas para crear una nueva publicacion"></div>
            <div class="nav-icon" id="buscador" (click)="showSearch()"><img src="/icons/lupa.png" alt="icono de acceso al apartado de busqueda general"></div>
            <div class="nav-icon" id="events" (click)="showEvents()"><img src="/icons/evento.png" alt="icono de acceso al apartado de eventos"></div>
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <!-- Encabezado -->
        <div class="header">
            <div style="width: 200px;"></div> <!-- Espacio placeholder para alinear el título -->
            <h1>MotorLand</h1>
            <div class="clock" id="clock"></div>
        </div>

        <!-- Cuerpo -->
        <div class="content">
            <div class="main-section" id="container">
                <!-- Contenido principal (2/3) -->
                <router-outlet/>
            </div>
            <div class="side-section">
                <!-- Contenido secundario (1/3) -->
                 @if (eventosInscritos.length > 0) {
                    <div class="eventos">
                        <app-eventos-side
                        [eventosInscritos]="eventosInscritos"
                        >
                        </app-eventos-side>
                        
                    </div>
                  }
            </div>
        </div>
    </div>

    

    <!-- <script src="js/scriptPagPrincipal.js"></script> -->
    <!-- <script src="js/scriptUserProfile.js"></script> -->
</body>

<!-- Ventana modal para crear publicación -->
<div class="modal" *ngIf="showModal">
  <div class="modal-content">
    <span class="close" (click)="closeModal()">×</span>
    <form [formGroup]="postForm" (ngSubmit)="onSubmit()">

      <label for="titulo">Título:</label>
      <input type="text" id="titulo" formControlName="titulo" required />
      <div *ngIf="postForm.get('titulo')?.errors?.['required'] && postForm.get('titulo')?.touched" class="error">
        El título es obligatorio.
      </div>

      <label for="texto">Texto:</label>
      <textarea id="texto" formControlName="texto" required></textarea>
      <div *ngIf="postForm.get('texto')?.errors?.['required'] && postForm.get('texto')?.touched" class="error">
        El texto es obligatorio.
      </div>

      <div>
        <label for="newHashtagInput">Hashtags:</label>
        <input
          type="text"
          id="newHashtagInput"
          (keydown.enter)="addHashtagFromInput()"
          placeholder="Escribe un hashtag y presiona Enter"
          #hashtagInput
        />
      </div>

      <div class="selected-hashtags" *ngIf="selectedHashtags.length > 0">
        <strong>Hashtags Añadidos:</strong>
        <span class="hashtag-item" *ngFor="let hashtag of selectedHashtags">
          {{ hashtag }}
          <button type="button" (click)="removeSelectedHashtag(hashtag)">x</button>
        </span>
      </div>

      <label for="imagen">Imagen (opcional):</label>
      <input type="file" id="imagen" (change)="onFileChange($event)" accept="image/*" />

      <button type="button" (click)="onSubmit()" [disabled]="!postForm.valid">Guardar</button>
    </form>
  </div>
</div>
</html>
