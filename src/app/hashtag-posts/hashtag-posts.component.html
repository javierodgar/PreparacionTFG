<div class="container">
    <h1>Publicaciones con el hashtag: #{{ hashtag }}</h1>
  
    <div class="post-list">
      <div *ngIf="loading">Cargando publicaciones...</div>
      <div *ngIf="error" class="error">{{ error }}</div>
      <div *ngIf="posts.length === 0 && !loading && !error">No se encontraron publicaciones con este hashtag.</div>
      <div *ngFor="let post of posts" class="post-item">
        <h2>{{ post.title }}</h2>
        <p>{{ post.excerpt }}</p>
        <a [routerLink]="['/main/big_post', post.id]">Leer más</a>
        <div *ngIf="post.hashtags && post.hashtags.length > 0" class="post-hashtags">
          Etiquetas:
          <span *ngFor="let tag of post.hashtags" class="hashtag">#{{ tag }}</span>
        </div>
      </div>
    </div>
  </div>
