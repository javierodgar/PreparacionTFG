<div *ngIf="posts.length === 0">
    <p>Este usuario no tiene publicaciones.</p>
  </div>
  <div *ngFor="let post of posts" class="post">
    <div (click)="goToPost(post.id)">
      <h3>{{ post.titulo }}</h3>
      <img *ngIf="post.imagen" [src]="dataUrl + post.imagen" alt="Imagen de publicación" />
      <p>{{ post.texto }}</p>
      <div *ngIf="post.hashtags" class="hashtags">{{ post.hashtags }}</div>
    </div>
  </div>
